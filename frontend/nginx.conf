# ============================================================
# Financial Companion — nginx config
# Serves the built React app and proxies API calls to the
# backend container. All API traffic still requires JWT auth.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Client-side routing: fall back to index.html for all app routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + docs → backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived static asset caching (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check shortcut
    location = /health {
        return 200 "ok";
    }
}
